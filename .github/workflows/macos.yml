name: macOS

# The macOS app: the core's lints and tests on a Mac, the app built for Apple Silicon and Intel, and its windows drawn
# with the demo's devices in each language, light and dark. The zip a release carries (BatteryTray-macOS.zip) and the
# disk image people download (BatteryTray-macOS.dmg) are handed out, for trying a build before it is released and for
# attaching to the release.
#
# The signing key: the project's own certificate, which the users' permissions are tied to. Only the step that puts it
# into a keychain of this run gets the secrets, after everything that runs code from the crates (their build scripts)
# is done; the key is marked as not exportable there, and the keychain is deleted at the end. The actions are pinned to
# a commit.
on:
  workflow_dispatch:
  push:
    paths: ["src/**", "macos/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["src/**", "macos/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", ".github/workflows/macos.yml"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-about
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-macos-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: The core for both processors
        # As build.sh builds it, so that build.sh finds it built and runs no crate's code once the key is here
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            MACOSX_DEPLOYMENT_TARGET=13.0 cargo build --release --locked -p batterytray-macos --target "$target"
          done
      - name: The signing identity
        # Without the secrets (a fork's pull request) the app is signed ad hoc; a build for a release refuses that
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGNING_P12" ]; then
            echo "No signing secrets: the app is signed ad hoc"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign -x
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Build the app
        env:
          # The builds of main and of a tag are the ones a release takes: signed by the project's certificate, or none
          BATTERYTRAY_REQUIRE_SIGNING: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
          # The certificate's SHA-1: an app signed by another one fails the build
          BATTERYTRAY_SIGNING_ROOT: d8322e30bcee8e537996c533866bca797d480dba
        run: macos/build.sh universal
      - name: Forget the signing identity
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
      - name: Keep the update server out of reach
        # It would count each run's copy as a user; the app then asks GitHub, as it does whenever the server fails
        run: echo "0.0.0.0 updates.batterytray.workers.dev" | sudo tee -a /etc/hosts > /dev/null
      - name: Draw the windows
        # <lang> in the light appearance, <lang>-dark in the dark one
        run: |
          app=target/macos/BatteryTray.app/Contents/MacOS/BatteryTray
          for lang in ru en zh; do
            "$app" --snapshot "$RUNNER_TEMP/windows/$lang" "$lang" light
            "$app" --snapshot "$RUNNER_TEMP/windows/$lang-dark" "$lang" dark
          done
          ls -R "$RUNNER_TEMP/windows"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BatteryTray-macOS
          path: |
            target/macos/BatteryTray-macOS.zip
            target/macos/BatteryTray-macOS.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-windows
          path: ${{ runner.temp }}/windows
