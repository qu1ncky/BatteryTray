[package]
name = "batterytray"
# The release version: the updater (this one and the C# one before it) only installs an exe whose FileVersion
# equals the release's. The C# app ended at 1.8.8; 1.99.x were this app's betas.
version = "2.4.3"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Battery levels of wireless headsets, mice, keyboards and gamepads in the Windows tray and the macOS menu bar"
repository = "https://github.com/qu1ncky/BatteryTray"
build = "build.rs"
autobins = false

[lib]
path = "src/lib.rs"

# The app: tray, updater, autostart. Same name, switches and data as the C# exe it replaces.
[[bin]]
name = "BatteryTray"
path = "src/main.rs"

# Console tool to compare readings with the C# app: dump, watch, list
[[bin]]
name = "batterytray-core"
path = "src/bin/batterytray-core.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The update check's random number (updater::install_id), from the system's random source
getrandom = "0.3"

# The Windows app: Win32 and WinRT, and the windows in Slint
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Foundation",
    "Media_Core",
    "Media_Playback",
    "Storage_Streams",
    "Win32_Devices_PortableDevices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# WinRT's asynchronous calls (IAsyncOperation), which the windows crate uses but doesn't re-export: waited for with a
# timeout, which its own get() has none of
windows-future = "0.2"
raw-window-handle = "0.6"

slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "raw-window-handle-06",
    "unstable-winit-030",
] }

# The macOS core: IOKit and CoreFoundation are declared by hand, as the Win32 calls are; HTTPS goes through
# NSURLSession, which has no C interface. The app around it is written in Swift (macos/).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSData",
    "NSDate",
    "NSError",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
] }

[dev-dependencies]
png = "0.17"

# The Windows exe's resources and windows; build.rs uses them only when the target is Windows. Not under a target
# section: Cargo matches a build dependency's platform against the machine that builds, not the target.
[build-dependencies]
embed-resource = "3"
slint-build = "1"

[workspace]
# macos/core: the core as a static library for the macOS app (built on a Mac only; see docs/development.md)
members = [".", "macos/core"]

[profile.release]
# For size: a tray app that draws a few small windows now and then gains nothing from faster code (13.9 MB at 3,
# 10.4 MB at "z"). Most of what remains is Slint's own: the winit backend always brings SVG and image decoders, and
# its text layout the line-breaking data for complex scripts.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
